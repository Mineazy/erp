[package]
name = "mineazy-pos"
version = "1.0.0"
description = "Mineazy POS Desktop - offline-first Tauri wrapper for Mineazy ERP"
authors = ["Mineazy"]
license = "MIT"
repository = "https://github.com/Mineazy/erp"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.7", features = ["devtools"] }
tauri-plugin-shell = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-http = "2.4"
tauri-plugin-store = "2.2"
tauri-plugin-autostart = "2.4"
tauri-plugin-sql = { version = "2.2", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
